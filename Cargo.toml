[package]
name = "nix-capsule"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "signal"] }
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2.189"

[dev-dependencies]
proptest = "1.11.0"
test-case = "3.3.1"
tempfile = "3"

