[package]
name = "nix-capsule"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "ncap"
path = "src/client.rs"

[[bin]]
name = "ncap-server"
path = "src/server.rs"

[[bin]]
name = "ncap-init"
path = "src/init.rs"

[[bin]]
name = "ncap-direnv"
path = "src/direnv.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
anyhow = "1"
futures = "0.3"
color-eyre = { version = "0.6", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
