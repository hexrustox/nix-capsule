[package]
name = "nix-capsule"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ncap"
path = "src/client.rs"

[[bin]]
name = "ncap-server"
path = "src/server.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
anyhow = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
