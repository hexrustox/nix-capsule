name: Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build for ${{ matrix.system }}
        run: |
          nix build ".#packages.${{ matrix.system }}.ncap" \
            --no-link --print-out-paths > store-path
          mkdir -p releases
          tar czf "releases/${{ matrix.system }}.tar.gz" \
            -C "$(cat store-path)" bin share
          rm store-path
      - uses: softprops/action-gh-release@v2
        with:
          files: releases/*.tar.gz
